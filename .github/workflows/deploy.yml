name: EC2 SSH 자동 배포 (CI/CD)

# 🔔 main 브랜치에 코드가 푸시될 때 워크플로 실행
on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      # 1. 저장소 체크아웃
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. AWS Credentials 설정 (이 단계는 Runner에서 AWS CLI 등을 사용할 때 유효합니다.
      #    EC2에 전달하기 위해 아래 스크립트에서 사용합니다.)
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ap-northeast-2

      # 3. SSH 접속 & 배포
      - name: Deploy via SSH and Restart Server
        uses: appleboy/ssh-action@v1.0.1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            PROJECT_DIR="/backend"
            JAR_NAME="backend-0.0.1-SNAPSHOT.jar"
            REGION="ap-northeast-2" # AWS Region

            echo "== 1. 프로젝트 디렉토리로 이동 =="
            cd ${PROJECT_DIR} || exit 1
            
            echo "== 2. 최신 코드 Pull =="
            git pull origin main
            
            echo "== 3. gradlew 권한 부여 =="
            chmod +x ./gradlew

            echo "== 4. 빌드 =="
            ./gradlew clean build -x test || exit 1
            
            echo "== 5. 기존 프로세스 종료 =="
            CURRENT_PID=$(ps aux | grep java | grep ${JAR_NAME} | grep -v grep | awk '{print $2}')
            if [ -z "$CURRENT_PID" ]; then
                echo "실행 중인 애플리케이션 없음."
            else
                echo "기존 PID: ${CURRENT_PID} 종료"
                kill -9 $CURRENT_PID
                sleep 5
            fi

            echo "== 6. 새 JAR 실행 (AWS 자격 증명 주입) =="
            nohup java \
              # 일반 속성
              -Dgabia.sms.api-key='${{ secrets.GABIA_API_KEY }}' \
              \
              # AWS 자격 증명을 Spring Cloud AWS/SDK 설정에 맞춰 시스템 속성으로 주입
              -Dcloud.aws.credentials.accessKey='${{ secrets.AWS_ACCESS_KEY }}' \
              -Dcloud.aws.credentials.secretKey='${{ secrets.AWS_SECRET_KEY }}' \
              -Dcloud.aws.region.static=${REGION} \
              \
              -jar build/libs/${JAR_NAME} > app.log 2>&1 &

            echo "Deployment finished successfully."
