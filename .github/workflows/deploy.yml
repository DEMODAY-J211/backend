name: EC2 SSH 자동 배포 (CI/CD)

# 🔔 main 브랜치에 코드가 푸시될 때 워크플로 실행
on:
  push:
    branches:
      - main 

# 🛠️ 배포 작업을 정의
jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest # GitHub Actions가 사용할 환경

    steps:
      # 1. 저장소 코드 체크아웃
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. SSH 접속 및 배포 스크립트 실행
      - name: Deploy via SSH and Restart Server
        uses: appleboy/ssh-action@v1.0.1
        with:
          # 각 설정은 별도의 줄에 위치하며, with: 보다 두 칸 더 들여쓰기 합니다.
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22 # 기본 SSH 포트
          
          # 💡 EC2 서버에서 실행될 배포 명령어 
          # [프로젝트 경로]와 [JAR 파일 이름]을 실제 값으로 변경하세요.
          script: |
            # 서버에 접속하여 실행할 프로젝트 디렉토리 경로
            PROJECT_DIR="/backend" # 예시: 서버의 실제 프로젝트 경로로 변경
            JAR_NAME="backend-0.0.1-SNAPSHOT.jar" # 빌드 후 생성되는 JAR 파일 이름
            
            echo "== 1. 프로젝트 디렉토리로 이동 =="
            # 디렉토리 이동 시 cd 명령어가 PROJECT_DIR이 없는 경우를 대비하여 오류를 무시합니다.
            cd ${PROJECT_DIR} || exit 1 
            
            echo "== 2. 최신 코드 Pull =="
            git pull origin main 
            
            echo "== 3. gradlew 실행 권한 부여 (권한 문제 방지) =="
            chmod +x ./gradlew 

            echo "== 4. 프로젝트 빌드 (-x test 포함) =="
            # 빌드 실패 시 워크플로가 즉시 멈추도록 합니다.
            ./gradlew clean build -x test || exit 1 
            
            echo "== 5. 기존 Java 프로세스 종료 (Shutdown) =="
            # 현재 실행 중인 JAR 파일을 포함하는 프로세스 PID 찾기
            CURRENT_PID=$(ps aux | grep java | grep ${JAR_NAME} | grep -v grep | awk '{print $2}')

            if [ -z "$CURRENT_PID" ]; then
                echo "실행 중인 애플리케이션 없음. 새로 시작합니다."
            else
                echo "기존 프로세스 PID: ${CURRENT_PID} 종료 중..."
                # kill -9 (강제 종료)
                kill -9 $CURRENT_PID
                echo "종료 완료."
                # 종료 후 새 프로세스 시작 전까지의 다운타임 시간. (무중단 PM2 권장)
                sleep 5 
            fi

            echo "== 6. 새 JAR 파일 실행 (Start-up) =="
            # nohup으로 백그라운드에서 실행하고, 로그를 app.log에 기록
            nohup java -Dgabia.sms.api-key='${{ secrets.GABIA_API_KEY }}' -jar build/libs/${JAR_NAME} > app.log 2>&1 &
            
            echo "Deployment finished successfully. New process started."
